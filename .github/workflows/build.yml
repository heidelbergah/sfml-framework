# Mud Cats, built for Windows, macOS and Linux.
#
# Every push builds all three, so a change that breaks one of them shows
# up straight away; the downloads are kept on the run's page (Actions, the
# run, Artifacts) for a while. Pushing a version tag, like v0.15.0, also
# makes a GitHub Release with the three downloads on it:
#
#   git tag v0.15.0
#   git push origin v0.15.0
#
# The tag has to match the version in CMakeLists.txt's project() line.
#
#   Windows   MudCats-<version>-Windows.zip          MudCats.exe and its files
#   macOS     MudCats-<version>-macOS.dmg            Mud Cats.app, for Apple Silicon and Intel
#   Linux     MudCats-<version>-Linux-x86_64.AppImage  one file: make it executable and run it
#
# None of them is signed by a paid certificate yet, so Windows and macOS
# ask the player once before the first run (see the README).

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            configure: ""
            package: build-cmake/MudCats-*-Windows.zip
          - name: macOS
            os: macos-14
            # Both kinds of Mac in one app; macOS 11 and later.
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            package: build-cmake/MudCats-*-macOS.dmg
          - name: Linux
            # The oldest Ubuntu GitHub still has: built against an older C
            # library, the game runs on newer systems too (Arch included).
            os: ubuntu-22.04
            configure: ""
            package: build-cmake/MudCats-*-Linux-x86_64.AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for SFML
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: The version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-cmake/CMakeCache.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but CMakeLists.txt says $version"
            exit 1
          fi

      - name: Build
        run: cmake --build build-cmake --config Release --parallel

      - name: Package
        run: cmake --build build-cmake --config Release --target package

      - name: AppImage
        if: runner.os == 'Linux'
        run: bash tools/package/appimage.sh build-cmake

      - uses: actions/upload-artifact@v4
        with:
          name: MudCats-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mud Cats ${GITHUB_REF_NAME#v}" \
            --generate-notes
